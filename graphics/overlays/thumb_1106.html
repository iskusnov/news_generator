<style>
:root{--ink:#0D0D0F;--paper:#F5F0E8;--lime:#C8FF2E;--red:#FF3B30}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:var(--ink);position:relative;font-family:'Unbounded'}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(245,240,232,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(245,240,232,.05) 1px,transparent 1px);background-size:64px 64px}
.glow{position:absolute;border-radius:50%;filter:blur(30px)}
.face{position:absolute;right:-120px;bottom:-60px;height:700px;filter:drop-shadow(5px 0 0 var(--lime)) drop-shadow(-5px 0 0 var(--lime)) drop-shadow(0 -5px 0 var(--lime)) drop-shadow(0 20px 40px rgba(0,0,0,.6))}
.ttl{position:absolute;left:48px;top:60px;width:720px;font-weight:800;line-height:.95;letter-spacing:-.02em;color:var(--paper);text-transform:uppercase}
.ttl b{color:var(--lime);font-weight:800}.ttl i{font-style:normal;color:var(--red)}
.chip{position:absolute;left:48px;top:26px;padding:6px 12px;background:var(--lime);color:var(--ink);font-family:'JetBrains Mono';font-weight:700;font-size:16px;letter-spacing:.1em;border-radius:6px}
.card{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6);border:3px solid #fff}
.tag{position:absolute;padding:8px 16px;font-family:'Unbounded';font-weight:800;font-size:30px;border-radius:8px}
.bar{position:absolute;display:flex;align-items:center;gap:14px;padding:0 26px;height:84px;border-radius:42px;background:#fff;color:#444;font-family:'Manrope';font-weight:800;font-size:30px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
