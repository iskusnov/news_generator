.msg .st{position:absolute;left:16px;right:16px;top:50%;height:8px;background:#e0412f;transform-origin:left;border-radius:4px}
.typing{display:flex;gap:10px}.typing i{width:16px;height:16px;border-radius:50%;background:var(--muted)}
/* steps */
.steps{padding:40px 60px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.steps .hd{font-family:var(--mono);font-weight:600;font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.it{display:flex;align-items:center;gap:26px;padding:16px 26px;background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 10px 26px rgba(20,18,15,.08)}

.it span{font-weight:800;font-size:46px;letter-spacing:-.02em;line-height:1.1}
.it .m{margin-left:auto;font-weight:900;font-size:52px}
.it.x{border-color:#e0412f}.it.x .m{color:#e0412f}.it.ok{border-color:#2c9a5a}.it.ok .m{color:#2c9a5a}
/* vector */
.vec .ax{position:absolute;left:90px;top:60px;width:900px;height:500px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.vec .gr{position:absolute;left:90px;top:60px;width:900px;height:500px;background-image:linear-gradient(rgba(20,18,15,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(20,18,15,.07) 1px,transparent 1px);background-size:75px 75px}
.pt{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--ink)}
.pt.q{background:var(--a5);width:44px;height:44px;margin:-22px 0 0 -22px;box-shadow:0 0 0 10px rgba(245,166,35,.25)}
.pt.bad{background:#e0412f}
.pt em{position:absolute;left:52px;top:-6px;font-style:normal;font-weight:800;font-size:30px;white-space:nowrap;color:var(--ink)}
.vec .tg{position:absolute;right:70px;top:70px;padding:12px 22px;border-radius:30px;font-weight:800;font-size:34px;background:var(--ink);color:var(--paper)}
.vec .tg.r{background:#e0412f;color:#fff}.vec .tg.g{background:#2c9a5a;color:#fff}
/* rank */
.rank{padding:30px 120px;display:flex;flex-direction:column;justify-content:center;gap:12px;position:absolute;inset:0}
.rk{display:flex;align-items:center;gap:22px;height:78px;padding:0 24px;border-radius:16px;background:var(--warm);border:3px solid var(--line)}
.rk b{font-family:var(--mono);font-size:30px;color:var(--muted);width:90px}
.rk span{font-weight:800;font-size:34px}
.rk.ok{background:#fff3dd;border-color:var(--a5)}
.cut{position:absolute;left:80px;right:80px;height:8px;background:#e0412f;border-radius:4px;transform-origin:left}
.cut span{position:absolute;right:0;top:18px;padding:8px 18px;background:#e0412f;color:#fff;border-radius:22px;font-weight:800;font-size:28px;white-space:nowrap}
/* stage — свободная хореография: актёры с ключевыми кадрами (центр в координатах панели 1080×620) */
.ac{position:absolute;left:0;top:0}
.ac .in{display:flex;flex-direction:column;align-items:center;gap:12px}
.ac .bx{width:var(--z,150px);height:var(--z,150px);border-radius:calc(var(--z,150px)*.2);display:flex;align-items:center;justify-content:center;background:var(--paper);border:3px solid var(--ink);box-shadow:0 14px 34px rgba(20,18,15,.14)}
.ac .bx .ic{width:50%;height:50%}
.ac.a-ic.a .bx{background:var(--a5);border-color:var(--a5)}.ac.ink .bx{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ac.r .bx{background:#e0412f;border-color:#e0412f;color:#fff}.ac.g .bx{background:#2c9a5a;border-color:#2c9a5a;color:#fff}
.ac b{font-weight:800;font-size:38px;letter-spacing:-.02em;white-space:nowrap}
.ac small{font-family:var(--mono);font-size:20px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:-8px}
.ac.a-tx .in{font-weight:800;letter-spacing:-.045em;white-space:nowrap;line-height:1;display:block}
.ac.a-tx.a .in{color:var(--a5)}.ac.a-tx.r .in{color:#e0412f}.ac.a-tx.m .in{color:var(--muted)}.ac.a-tx.g .in{color:#2c9a5a}
.ac.a-pill .in{display:block;padding:12px 26px;border-radius:40px;background:var(--ink);color:var(--paper);font-weight:800;font-size:34px;white-space:nowrap}
.ac.a-pill.r .in{background:#e0412f;color:#fff}.ac.a-pill.a .in{background:var(--a5);color:var(--ink)}.ac.a-pill.g .in{background:#2c9a5a;color:#fff}.ac.a-pill.w .in{background:var(--paper);color:var(--ink);border:3px solid var(--line)}
.ac.a-ln .in{display:block;height:8px;border-radius:4px;background:var(--ink)}
.ac.a-ln.no .in{background:repeating-linear-gradient(90deg,#e0412f 0 16px,transparent 16px 28px)}.ac.a-ln.a .in{background:var(--a5);height:10px}
.ac.a-ln.a .in::after,.ac.a-ln.ar .in::after{content:'';position:absolute;right:-6px;top:50%;margin-top:-14px;border:14px solid transparent;border-left:22px solid var(--a5);border-right:0}
.ac.a-ln .in{position:relative}.ac.a-ln.ar .in::after{border-left-color:var(--ink)}
.ac.a-mk .in{display:flex;width:var(--z,110px);height:var(--z,110px);border-radius:50%;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--z,110px)*.62);color:#fff;background:#e0412f}
.ac.a-mk.ok .in{background:#2c9a5a}
.ac.a-dt .in{display:block;width:var(--z,30px);height:var(--z,30px);border-radius:50%;background:var(--ink)}
.ac.a-dt.a .in{background:var(--a5);box-shadow:0 0 0 10px rgba(245,166,35,.25)}.ac.a-dt.r .in{background:#e0412f}.ac.a-dt.g .in{background:#2c9a5a}
.ac.a-ring .in{display:block;width:var(--z,120px);height:var(--z,120px);border-radius:50%;border:5px solid var(--a5)}
.ac.a-card .in{display:flex;flex-direction:row;gap:20px;align-items:center;padding:20px 28px;border-radius:24px;background:var(--paper);border:3px solid var(--line);box-shadow:0 12px 30px rgba(20,18,15,.10);font-weight:800;font-size:40px;white-space:nowrap}
.ac.a-card .in .ic{width:48px;height:48px;color:var(--a7)}.ac.a-card.r .in{border-color:#e0412f}.ac.a-card.g .in{border-color:#2c9a5a}.ac.a-card.a .in{border-color:var(--a5);background:#fff3dd}
.ac.a-fr .in{display:block;position:relative;width:var(--w);height:var(--h);border:7px solid var(--a5);border-radius:46px;background:rgba(245,166,35,.08)}
.ac.a-fr .in span{position:absolute;left:50%;top:-34px;transform:translateX(-50%);padding:8px 22px;background:var(--a5);border-radius:30px;font-weight:800;font-size:34px;white-space:nowrap}
.pn.wd{border-radius:22px;box-shadow:0 18px 50px rgba(20,18,15,.16),0 0 0 2px rgba(20,18,15,.06)}
.pn.wd .lb{display:none;position:absolute;left:28px;top:20px;z-index:4;font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--a7)}
.pn.wd .ac:not(.a-ln) .in{zoom:1.12}
.pn.wd .ac.a-card .in{white-space:normal;max-width:1080px;line-height:1.15}
.ac.a-card .in{white-space:normal;max-width:940px;line-height:1.15}

/* ===== ТЕМА НЭЙШН v1 (11.11.2026): бумага/тушь, один жёлтый акцент, плоско, пунктир = связь ===== */
:root{--paper:#F6F5F1;--warm:#E7E4DC;--line:#D8D6CF;--ink:#15161A;--body:#15161A;--muted:#5E6168;--a3:#F2CB3A;--a5:#F2CB3A;--a7:#15161A;--sans:'Onest',sans-serif;--mono:'JetBrains Mono',monospace;--grn:#1F8F50;--dev:#3446D3}

.top{top:44px}.logo{font-weight:800;font-size:32px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:14px}.logo .st{font-family:var(--mono);font-weight:500;font-size:22px;letter-spacing:.02em;color:var(--muted)}
.pill{background:var(--ink);color:var(--paper);border-radius:6px;font-weight:700}
.title{font-size:56px;letter-spacing:-.045em;line-height:1.02}.title b{color:var(--ink);box-shadow:inset 0 -.12em 0 var(--ink)}
.fr .br{display:none}
.nm{left:0;bottom:0;border-left:0;border-radius:0 8px 0 0;box-shadow:none;display:flex;align-items:center;gap:12px;padding:12px 20px}
.nm::before{content:'';width:14px;height:14px;background:var(--dev)}
.cover span{color:var(--muted)}
.pn{background:var(--paper)}.bgd{display:none}
.pg{background:var(--ink);height:4px}
.wp{background:var(--a5)}.wp i{background:var(--ink)}
.ac .bx{border:2.8px solid var(--ink);border-radius:16px;box-shadow:none;background:#fff}
.ac.a-ic.a .bx{background:var(--a5);border-color:var(--ink)}
.ac.r .bx{background:var(--ink);border-color:var(--ink);color:var(--paper)}.ac.g .bx{background:var(--grn);border-color:var(--grn)}
.ac.a-tx.a .in{color:var(--ink);box-shadow:inset 0 -.18em 0 var(--a5)}.ac.a-tx.r .in{color:var(--ink);text-decoration:line-through;text-decoration-thickness:.08em}.ac.a-tx.g .in{color:var(--grn)}

.ac.a-ln.a .in{height:8px;border-top:0;background:var(--a5);border-radius:4px}
.ac.a-mk .in{background:var(--ink);color:var(--paper)}.ac.a-mk.ok .in{background:var(--grn)}

.ac.a-card .in{border:2.8px solid var(--line);border-radius:16px;box-shadow:none;background:#fff}

.it{border:2.8px solid var(--line);border-radius:16px;box-shadow:none;background:#fff}

.msg.bot{background:#fff;border:2.8px solid var(--line)}
.kin .ln .hl{color:var(--ink);box-shadow:inset 0 -.18em 0 var(--a5)}.kin .ln .stk i{background:var(--ink)}
.kin .kic{background:var(--a5);border-radius:16px}
.dash{position:absolute;left:48px;right:48px;top:1520px;border-top:2.8px dashed var(--line)}
.cap{font-family:var(--sans);font-size:64px;letter-spacing:-.025em;top:1548px;line-height:1.16}
.cap .w{margin:0 .06em;padding:0 .1em;border-radius:10px;color:var(--ink)}.cap .w.on{background:var(--a5);color:var(--ink)}
.end{background:var(--paper);align-items:flex-start;padding:0 90px;gap:28px}

    d.innerHTML='<div class="bar"></div>'+h.lines.map(l=>`<div class="hl2 ${l.size?'s'+l.size:''}">${l.words.map(w=>`<span class="hw ${w.hl?'on':''}">${esc(w.t)}</span>`).join(' ')}</div>`).join('')+(h.kick?`<div class="kick">${esc(h.kick.t)}</div>`:'');st.appendChild(d);
    const flat=h.lines.flatMap(l=>l.words);const ws=[...d.querySelectorAll('.hw')];TL.set(ws,{autoAlpha:0},0);
    ws.forEach((x,i)=>TL.fromTo(x,{scale:2,autoAlpha:0,rotation:-7},{scale:1,autoAlpha:1,rotation:0,duration:.22,ease:'back.out(2.4)',immediateRender:false},flat[i].at));
    TL.fromTo(d.querySelector('.bar'),{scaleX:0},{scaleX:1,duration:.3,ease:'power3.out'},flat[0].at);
    if(h.kick){TL.set(d.querySelector('.kick'),{autoAlpha:0},0).to(d.querySelector('.kick'),{autoAlpha:1,duration:.2},h.kick.at)}
    TL.set(d,{yPercent:0},0).to(d,{yPercent:-100,duration:.28,ease:'power3.in'},h.out-.28);}
  window._chunks=p.chunks;TL.seek(0);
};
window.seek=function(t){
  TL.seek(t,false);
  const cap=st.querySelector('.cap');if(!cap)return;const c=window._chunks.find(c=>t>=c.s&&t<c.e);
  if(!c){cap.innerHTML='';return}
  let cur=-1;c.words.forEach((w,i)=>{if(t>=w.s)cur=i});cap.innerHTML=c.words.map((w,i)=>`<span class="w ${i===cur?'on':''}">${esc(w.t)}</span>`).join(' ');
  const k=Math.min(1,(t-c.s)/.12);cap.style.transform=`scale(${.94+.06*k})`;cap.style.opacity=k;
};
</script></body></html>
