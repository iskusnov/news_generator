<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///home/claude/news_generator/graphics/node_modules/@fontsource/unbounded/800.css">
<link rel="stylesheet" href="file:///home/claude/news_generator/graphics/node_modules/@fontsource/manrope/800.css">
<link rel="stylesheet" href="file:///home/claude/news_generator/graphics/node_modules/@fontsource/jetbrains-mono/700.css">
<script src="file:///home/claude/news_generator/graphics/node_modules/gsap/dist/gsap.min.js"></script>
<style>
:root{--ink:#0D0D0F;--paper:#F5F0E8;--lime:#C8FF2E;--red:#FF3B30;--green:#2EE59D}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);font-family:Manrope;color:var(--paper);position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(245,240,232,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(245,240,232,.05) 1px,transparent 1px);background-size:80px 80px}
.mono{font-family:'JetBrains Mono';font-weight:700;letter-spacing:.08em}
.hd{position:absolute;left:90px;top:60px;display:flex;align-items:center;gap:24px}
.hd .b{padding:10px 18px;background:var(--lime);color:var(--ink);border-radius:6px;font-size:24px}
.hd .t{font-family:Unbounded;font-weight:800;font-size:44px}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.title .a{font-family:Unbounded;font-weight:800;font-size:110px;line-height:1.05}
.title .a b{color:var(--lime)}
.title .s{margin-top:34px;font-size:40px;color:rgba(245,240,232,.75)}
.st{position:absolute;inset:0;opacity:0}
.img{position:absolute;left:90px;top:170px;width:1060px;height:820px;display:flex;align-items:center;justify-content:center}
.img .w{position:relative;max-width:100%;max-height:100%;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);border:4px solid rgba(245,240,232,.9)}
.img img{display:block;max-width:1052px;max-height:812px}
.img .heat{position:absolute;inset:0;mix-blend-mode:multiply;opacity:0}
.img .scan{position:absolute;left:0;right:0;height:8px;background:var(--lime);box-shadow:0 0 30px 10px rgba(200,255,46,.6);top:0;opacity:0}
.pn{position:absolute;left:1210px;top:200px;width:620px}
.pn .k{font-size:26px;color:rgba(245,240,232,.6)}
.pn .f{margin-top:10px;font-family:Unbounded;font-weight:800;font-size:44px;line-height:1.15}
.verdict{margin-top:44px;padding:30px 34px;border-radius:20px;font-family:Unbounded;font-weight:800;font-size:58px;line-height:1.05;opacity:0}
.verdict.ai{background:var(--red);color:#fff}.verdict.no{background:var(--green);color:var(--ink)}
.verdict small{display:block;margin-top:12px;font-family:Manrope;font-size:30px;font-weight:800;opacity:.9}
.ev{margin-top:30px;font-size:32px;line-height:1.4;color:rgba(245,240,232,.85);opacity:0}
.ev b{color:var(--lime)}
.sum{position:absolute;inset:0;opacity:0}
.sum .row{position:absolute;left:90px;right:90px;top:200px;display:flex;gap:40px;justify-content:center}
.sum .c{width:400px;text-align:center}
.sum .c .p{height:330px;border-radius:16px;background-size:cover;background-position:center;border:4px solid rgba(245,240,232,.9)}
.sum .c .v{margin-top:20px;display:inline-block;padding:12px 22px;border-radius:12px;font-family:Unbounded;font-weight:800;font-size:32px}
.sum .c .v.ai{background:var(--red);color:#fff}.sum .c .v.no{background:var(--green);color:var(--ink)}
.sum .c .l{margin-top:12px;font-size:26px;color:rgba(245,240,232,.7)}
.sum .cc{position:absolute;left:150px;right:150px;top:740px;text-align:center;font-family:Unbounded;font-weight:800;font-size:46px;line-height:1.25}
.sum .cc b{color:var(--lime)}
.src{position:absolute;right:90px;bottom:46px;font-size:22px;color:rgba(245,240,232,.5)}
</style></head><body><div class="grid"></div>
<div class="hd mono"><span class="b">ТЕСТ</span><span class="t" style="font-family:Unbounded;letter-spacing:0">Детектор Pangram Image 1.0</span></div>
<div class="title" id="t0"><div class="a">Проверяем<br><b>детектором</b></div><div class="s">3 картинки — ИИ (Gemini, из одного моего фото) · 1 — настоящее фото</div></div>
<div id="steps"></div>
<div class="sum" id="sum"><div class="row" id="row"></div><div class="cc">Все 4 — верно. Но в ИИ-картинках он нашёл ещё и <b>метки Google</b> в файле.<br>Скриншот их стирает — поэтому <b>проверяйте источник</b>.</div></div>
<div class="src mono">pangram.com · проверка 06.11.2026</div>
<script>
const D=[{f:'i1.jpg',k:'Картинка 1',n:'«У Белого дома»',ai:1,c:'Medium',e:'Метка <b>Google (C2PA)</b> и водяной знак <b>SynthID</b>'},
{f:'i2.jpg',k:'Картинка 2',n:'«В студии AI NEWS»',ai:1,c:'High',e:'Метка <b>Google (C2PA)</b> и водяной знак <b>SynthID</b>'},
{f:'i3.jpg',k:'Картинка 3',n:'Плакат «VOTE ANTON 2026»',ai:1,c:'High',e:'Метка <b>Google (C2PA)</b> и водяной знак <b>SynthID</b>'},
{f:'i4.jpg',k:'Картинка 4',n:'Настоящий кадр с камеры',ai:0,c:'Medium',e:'Меток ИИ нет. Но и данных камеры нет — <b>уверенность средняя</b>'}];
const S=document.getElementById('steps');
S.innerHTML=D.map((d,i)=>`<div class="st" id="s${i}"><div class="img"><div class="w"><img src="${d.f}"><div class="heat" style="background:${d.ai?'rgba(255,70,50,.85)':'rgba(46,229,157,.5)'}"></div><div class="scan"></div></div></div>
<div class="pn"><div class="k mono">${d.k} из 4</div><div class="f">${d.n}</div><div class="verdict ${d.ai?'ai':'no'}">${d.ai?'ИИ обнаружен':'ИИ не найден'}<small>уверенность: ${d.c==='High'?'высокая':'средняя'}</small></div><div class="ev">${d.e}</div></div></div>`).join('');
document.getElementById('row').innerHTML=D.map(d=>`<div class="c"><div class="p" style="background-image:url(${d.f})"></div><div class="v ${d.ai?'ai':'no'}">${d.ai?'ИИ':'НЕ ИИ'}</div><div class="l">${d.n}</div></div>`).join('');
const tl=gsap.timeline({paused:true});
tl.from('#t0 .a',{y:60,opacity:0,duration:.5,ease:'back.out(1.7)'},0).from('#t0 .s',{opacity:0,duration:.4},.3).to('#t0',{opacity:0,duration:.3},1.6);
window.SFX=[];
D.forEach((d,i)=>{const t=1.9+i*3.1,el='#s'+i;
 tl.to(el,{opacity:1,duration:.25},t).from(el+' .w',{scale:.9,opacity:0,duration:.4,ease:'power3.out'},t)
   .fromTo(el+' .scan',{top:'0%',opacity:1},{top:'100%',duration:1.0,ease:'none'},t+.35).to(el+' .scan',{opacity:0,duration:.1},t+1.35)
   .to(el+' .heat',{opacity:d.ai?.55:.35,duration:.3},t+1.35)
   .fromTo(el+' .verdict',{scale:1.6,opacity:0,rotate:-4},{scale:1,opacity:1,rotate:-2,duration:.35,ease:'back.out(2)'},t+1.45)
   .to(el+' .ev',{opacity:1,duration:.3},t+1.9).to(el,{opacity:0,duration:.25},t+2.9);
 SFX.push(t+1.45);});
const t2=1.9+4*3.1;
tl.to('#sum',{opacity:1,duration:.3},t2).from('.sum .c',{y:60,opacity:0,stagger:.12,duration:.4,ease:'back.out(1.6)'},t2).from('.sum .cc',{opacity:0,y:30,duration:.4},t2+.7);
window.DUR=t2+5.0; window.seek=t=>tl.seek(t,false);
</script></body></html>
